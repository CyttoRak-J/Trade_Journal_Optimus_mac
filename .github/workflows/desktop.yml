name: Desktop installers

# Builds the Tauri desktop installers: a Windows setup.exe (NSIS) and a
# macOS .dmg (Apple Silicon). Run it manually from the Actions tab to get
# the installers as run artifacts, or push a version tag (git tag v0.1.0 &&
# git push origin v0.1.0) to also publish them as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            bundle: desktop/src-tauri/target/release/bundle/nsis/*.exe
            name: trade-journal-windows
          - os: macos-latest
            script: build:mac
            bundle: desktop/src-tauri/target/release/bundle/dmg/*.dmg
            name: trade-journal-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6
      # The desktop app bundles this Node binary, so native modules built by
      # pnpm install (better-sqlite3) match the runtime that ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Trade Journal ${{ github.ref_name }}
          files: installers/*
          body: |
            Desktop installers for Trade Journal.

            - **Windows:** download the `x64-setup.exe` and run it. If Windows shows "Windows protected your PC", choose **More info → Run anyway** (the installer is not code-signed).
            - **macOS (Apple Silicon):** download the `.dmg`, drag **Trade Journal** to Applications, then right-click it and choose **Open** the first time (the app is not notarized).

            Your journal data stays on your computer.
