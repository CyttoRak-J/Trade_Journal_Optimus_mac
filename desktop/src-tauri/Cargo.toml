[package]
name = "trade-journal-desktop"
version = "0.1.0"
description = "Trade Journal desktop app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde_json = "1"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
